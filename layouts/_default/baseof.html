<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/styles.css">
    <!-- React (production) -->
    <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Our React components -->
    <script defer src="/react-components/dist/react-components.js"></script>
</head>
<body>
    <div class="home-link">
        <a href="/">Home</a>
    </div>
    <header>
        <h2>
            <img src="/img/black_flag_noclip.png" alt="Black Flag Logo" class="logo">
            {{ .Title }}
            <img src="/img/black_flag_noclip.png" alt="Black Flag Logo" class="logo">
        </h2>
    </header>
    {{ block "main" . }}{{ end }}
    <!-- React root container -->
    <div id="react-root"></div>
    
    <!-- Initialize React -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const root = ReactDOM.createRoot(document.getElementById('react-root'));
        root.render(React.createElement(ReactComponents.Example));
      });
    </script>
</body>
</html>
